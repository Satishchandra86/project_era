<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UserHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <a class="brand" href="{{ url_for('index') }}">UserHub</a>
    <div><a href="{{ url_for('register') }}">Register</a></div>
</nav>

<main class="form-page">
    <div class="card small">
        <h2>Login</h2>
        <p class="muted">Login to open your dashboard.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>Email
                <input type="email" name="email" required>
            </label>

            <label>Password
                <input type="password" name="password" required>
            </label>

            <button class="button" type="submit">Login</button>
        </form>

        <p class="center">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</main>
</body>
</html>
